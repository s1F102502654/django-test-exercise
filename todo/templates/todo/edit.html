{% load static %}
<!DOCTYPE html>
<html lang="ja">

  <head>
    <title>To Do Application</title>
    <meta charset="UTF-8">
    <meta name="author" content="INIAD">
    <link rel="stylesheet" href="{% static 'todo/style.css' %}">
  </head>

  <body>
    <h1>Edit task</h1>
    <p>You can edit tasks from the following form.</p>
    <form action="{% url 'update' task.id%}" method="post">
      {% csrf_token %}
      <div>
        <label for="titleInput">Title</label><br>
        <input
          id="titleInput"
          name="title"
          type="text"
          placeholder="Input title"
          value="{{ title_value }}"
          required
          class="{% if errors.title %}field-error{% endif %}"
        >
        {% if errors.title %}<p class="error-message">Titleを入力してください。</p>{% endif %}
      </div>
      <div>
        <label for="dueInput">Due at:</label><br>
        <input
          id="dueInput"
          name="due_at"
          type="datetime-local"
          value="{{ due_at_value }}"
          required
          max="9999-12-31T23:59"
          class="{% if errors.due_at %}field-error{% endif %}"
        >
        {% if errors.due_at %}<p class="error-message">Due atを正しく入力してください。</p>{% endif %}
      </div>
      <div>
        <button type="submit">Submit</button>
      </div>
    </form>
    <br>
  </body>

</html>
